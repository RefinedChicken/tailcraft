plugins { id 'net.fabricmc.fabric-loom' version '1.19.4' }

version = "${project.mod_version}+mc26.3"
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.x is unobfuscated: plain implementation, not modImplementation, and no mappings.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def expansions = [version: project.version, minecraft_range: project.minecraft_range]
    inputs.properties expansions
    filesMatching('fabric.mod.json') { expand expansions }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
test { useJUnitPlatform() }
tasks.named('sourcesJar') { exclude 'assets/tailcraft/native/**' }

loom {
    runs {
        server { runDir 'run-server' }
    }
}
