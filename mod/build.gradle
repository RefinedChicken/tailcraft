plugins { id 'net.fabricmc.fabric-loom-remap' }

// One jar per Minecraft range. Each folder in versions/ holds a range's dependency versions
// (version.properties) and the code that differs between ranges (java/). Pick one with
// -Pminecraft_target=<folder>; gradle.properties sets the default.
def target = project.minecraft_target
def targetDir = file("versions/$target")
if (!targetDir.isDirectory()) {
    throw new GradleException("Unknown minecraft_target '$target'. Choose one of: ${file('versions').list().sort().join(', ')}")
}
def mc = new Properties()
file("$targetDir/version.properties").withInputStream { mc.load(it) }

version = "${project.mod_version}+mc${mc.range_label}"
group = project.maven_group

base { archivesName = project.archives_base_name }

sourceSets.main.java.srcDir("$targetDir/java")

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${mc.minecraft_version}"
    mappings "net.fabricmc:yarn:${mc.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${mc.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def expansions = [version: project.version, minecraft_range: mc.minecraft_range]
    inputs.properties expansions
    filesMatching('fabric.mod.json') { expand expansions }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
test { useJUnitPlatform() }
tasks.named('sourcesJar') { exclude 'assets/tailcraft/native/**' }

// Separate dev directories so a dev server and dev client don't share config/ or saves.
loom {
    runs {
        server { runDir 'run-server' }
    }
}
