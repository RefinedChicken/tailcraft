name: Build

# Every push and pull request builds the helpers and the mod and runs the tests.
# Pushing a version tag (for example v0.2.0) also publishes a GitHub Release with the jar.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Cache Go toolchain and modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/tailcraft/go
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('scripts/build-natives.sh', 'helper/go.sum') }}

      # build-natives.sh downloads and checksum-verifies the pinned Go toolchain.
      - name: Build native helpers
        run: scripts/build-natives.sh

      - name: Test helper
        working-directory: helper
        run: |
          export PATH="$HOME/.cache/tailcraft/go/$(sed -n 's/^GO_VERSION=//p' ../scripts/build-natives.sh)/bin:$PATH"
          CGO_ENABLED=0 GOTOOLCHAIN=local go test ./...

      - name: Pick version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^mod_version=//p' gradle.properties)+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test mod
        run: ./gradlew :mod:build -Pmod_version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailcraft-${{ steps.version.outputs.version }}
          path: mod/build/libs/tailcraft-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tailcraft ${GITHUB_REF_NAME#v} (Minecraft 1.21.1)" \
            --generate-notes
